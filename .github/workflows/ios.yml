name: iOS

# هذا الـ workflow ليس رفاهية — هو **حلقة التحقق الوحيدة** للمشروع:
# التطوير يجري على ويندوز حيث لا يوجد Xcode، وSwiftUI لا يُبنى ولا يُصوَّر إلا
# على macOS. كل لقطة تُفحص وكل اختبار يُشغَّل يأتي من هنا.
# دقائق macOS مجانية لأن المستودع عام.

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build-test-shoot:
    # macos-26 حصرًا: المشروع يعتمد Liquid Glass الأصلي، وهو غير موجود في
    # SDK الخاص بـ Xcode 16 على الصور الأقدم.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: منع المواد القديمة
        run: |
          # `ultraThinMaterial` وأخواتها ممنوعة منعًا باتًا في هذا المشروع.
          # الفحص هنا لا في المراجعة: مادة واحدة تتسلّل تكفي لجعل سطحين
          # يبدوان مختلفين، ولن يظهر ذلك في أي خطأ ترجمة.
          if grep -rnE "ultraThinMaterial|thinMaterial|regularMaterial|thickMaterial|ultraThickMaterial|\.blur\(radius" ios/ --include='*.swift'; then
            echo "::error::مادة ضبابية قديمة في المشروع — استخدم glassEffect وحده"
            exit 1
          fi
          echo "نظيف: لا مواد قديمة"

      - name: بيئة Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: توليد مشروع Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: اختيار المحاكي
        id: sim
        run: |
          # ديناميكي: أسماء الأجهزة تتغيّر بين صور الرَنَر، وتثبيت اسم بعينه
          # يكسر البناء بصمت عند أول تحديث للصورة.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name']:
                          print(d['udid']); sys.exit(0)
          sys.exit('لا يوجد محاكي iPhone')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" || true

      - name: بناء واختبار
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Games.xcodeproj \
            -scheme Games \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/build \
            -resultBundlePath ios/Result.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tail -80

      - name: استخراج اللقطات من نتيجة الاختبار
        if: always()
        run: |
          mkdir -p shots
          # Xcode 16 غيّر واجهة xcresulttool؛ نجرّب الحديثة ثم القديمة بدل
          # افتراض إصدار الرَنَر.
          xcrun xcresulttool export attachments \
            --path ios/Result.xcresult --output-path shots 2>/dev/null \
          || xcrun xcresulttool export --legacy --type directory \
            --path ios/Result.xcresult --output-path shots 2>/dev/null \
          || echo "تعذّر الاستخراج بالأمرين"

          # المرفقات تخرج بأسماء UUID — نعيد تسميتها من manifest.json
          python3 - <<'PY'
          import json, os, shutil, glob
          man = 'shots/manifest.json'
          if not os.path.exists(man):
              print('لا يوجد manifest'); raise SystemExit(0)
          data = json.load(open(man))
          out = 'shots/named'; os.makedirs(out, exist_ok=True)
          n = 0
          for entry in data if isinstance(data, list) else [data]:
              for att in entry.get('attachments', []):
                  src = os.path.join('shots', att.get('exportedFileName', ''))
                  name = att.get('suggestedHumanReadableName') or att.get('name') or f'shot{n}'
                  if os.path.exists(src) and src.lower().endswith('.png'):
                      shutil.copy(src, os.path.join(out, f'{name}.png')); n += 1
          print(f'{n} لقطة مسمّاة')
          PY
          find shots -name '*.png' | head -30
          echo "عدد اللقطات: $(find shots -name '*.png' | wc -l)"

      - name: رفع اللقطات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn

      - name: رفع نتيجة الاختبار عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ios/Result.xcresult
