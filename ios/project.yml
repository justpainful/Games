# مشروع Xcode يُولَّد من هذا الملف بـ XcodeGen.
#
# السبب: ملف .xcodeproj حزمة ثنائية عمليًا، لا تُراجَع في diff ولا تُحرَّر من
# غير ماك. هذا الملف نصّي، أقدر أعدّله من أي مكان، ويُعاد توليد المشروع في CI.
name: Games

options:
  bundleIdPrefix: com.justpainful
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Games:
    type: application
    platform: iOS
    sources:
      - path: Games
    info:
      path: Games/Info.plist
      properties:
        CFBundleDisplayName: العاب
        CFBundleDevelopmentRegion: ar
        # فارغة عمدًا: أي UIColorName هنا يتطلب أصلًا في asset catalog،
        # وغيابه يفشل البناء برسالة غامضة
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Cairo-Regular.ttf
          - Cairo-Bold.ttf
          - Baloo-Bold.ttf
          - Baloo-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justpainful.games
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # المحاكي لا يحتاج توقيعًا، وبدون هذا يفشل البناء في CI بلا شهادة
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
