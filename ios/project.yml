# مشروع Xcode يُولَّد من هذا الملف بـ XcodeGen.
#
# السبب: ملف .xcodeproj حزمة ثنائية عمليًا، لا تُراجَع في diff ولا تُحرَّر من
# غير ماك. هذا الملف نصّي، أقدر أعدّله من أي مكان، ويُعاد توليد المشروع في CI.
name: Games

options:
  bundleIdPrefix: com.justpainful
  # iOS 26 حد أدنى: المشروع يعتمد Liquid Glass الأصلي بلا أي بديل، وخفض هذا
  # الرقم يعيد الحاجة إلى مواد قديمة ممنوعة في هذا المشروع.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  Games:
    type: application
    platform: iOS
    sources:
      - path: Games
    info:
      path: Games/Info.plist
      properties:
        CFBundleDisplayName: Arcade
        CFBundleDevelopmentRegion: ar
        # فارغة عمدًا: أي UIColorName هنا يتطلب أصلًا في asset catalog،
        # وغيابه يفشل البناء برسالة غامضة
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        APIBaseURL: $(API_BASE_URL)
        # ————— لماذا يحتاج التطبيق إذنًا للشبكة المحلية —————
        #
        # منذ iOS 14 لا يصل التطبيق إلى عنوان في الشبكة المحلية إلا بإذن صريح
        # من المستخدم، والإذن لا يُطلب أصلًا ما لم يوجد هذا المفتاح. وبلا
        # المفتاح يُرفض الاتصال بلا سؤال وبلا رسالة، فيبدو الخادم كأنه مطفأ
        # ويُبحث عن العطل في الشبكة والجدار الناري بلا طائل.
        NSLocalNetworkUsageDescription: >-
          للاتصال بخادم الألعاب على شبكتك المحلية.
        # ————— ولماذا يُسمح بـ http الصريح، ولماذا مفتاح واحد لا اثنان —————
        #
        # ATS يمنع http بلا تشفير منذ iOS 9، وخادم التطوير هنا على http بلا
        # شهادة. وهذه نسخة تُثبَّت جانبيًا للتجربة لا تدخل المتجر، فالاستثناء
        # مقبول فيها وحدها، وأي نسخة عامة تحتاج https ويسقط هذا الحقل.
        #
        # وكان هنا `NSAllowsLocalNetworking: true` بجانبه، وهو ما عطّل الاثنين
        # معًا: وجود المفتاح الأحدث يُلغي مفعول `NSAllowsArbitraryLoads` على
        # iOS 10 فما فوق، و`NSAllowsLocalNetworking` لا يغطّي إلا العناوين
        # المحلية الحقيقية فلا يشمل عنوان Tailscale.
        #
        # والعطل الناتج كان يبدو في مكان بعيد عن سببه: طلبا المصادقة يخرجان من
        # سفاري داخل جلسة `ASWebAuthenticationSession` وهو لا يخضع لـATS، فيصلان
        # ويُسجَّل الدخول بنجاح. ثم أول طلب يخرج من التطبيق نفسه يُحجب، فيظهر
        # للمستخدم «تعذّر تسجيل الدخول» بعد أن نجح تسجيل الدخول فعلًا.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.justpainful.games.auth
            CFBundleURLSchemes: [gamesapp]
        UIAppFonts:
          - Cairo-Regular.ttf
          - Cairo-Bold.ttf
          - Baloo-Bold.ttf
          - Baloo-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justpainful.games
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # المحاكي لا يحتاج توقيعًا، وبدون هذا يفشل البناء في CI بلا شهادة
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # ————— عنوان الخادم —————
        #
        # كان `http://localhost:8080`، وهو خطأ من وجهين معًا: المنفذ 8099 لا
        # 8080، و`localhost` على الجوال يعني الجوالَ نفسه لا الكمبيوتر. فالنسخة
        # المبنية بهذا العنوان تطلب خادمًا داخل الآيفون، ولا جدارَ ناريّ ولا
        # إعدادَ شبكة يصلح ذلك.
        #
        # والعنوان الآن عبر Tailscale لأنه الوحيد الذي يعمل في الحالتين: داخل
        # البيت وخارجه. وعنوان الشبكة المحلية `192.168.1.4` يعمل داخل البيت
        # وحده، ويسقط أيضًا حين يغيّر الراوتر توزيعه.
        API_BASE_URL: http://100.85.165.37:8099

  # ————————————————————————— مِقود —————————————————————————
  #
  # تطبيق ثانٍ في نفس المشروع لا مشروع مستقل: يتقاسم مع الألعاب نظام التصميم
  # والخطوط، وفصلهما يعني نسختين من `Tokens.swift` تتفرّقان عند أول تعديل لون.
  #
  # وهدفه غير هدف الألعاب تمامًا: ذاك للاعبين وهذا لصاحب البوت، فلا يشتركان في
  # شاشة ولا في مصادقة ولا في عنوان خادم.
  Miqwad:
    type: application
    platform: iOS
    sources:
      - path: Miqwad
      # نظام التصميم مشترك — لون واحد وخط واحد للسطحين
      - path: Games/Design
      - path: Games/Resources
    info:
      path: Miqwad/Info.plist
      properties:
        CFBundleDisplayName: مِقود
        CFBundleDevelopmentRegion: ar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ————— لماذا يحتاج إذن الشبكة المحلية واسم الخدمة معًا —————
        #
        # منذ iOS 14 لا يبحث `NWBrowser` عن خدمة لم تُعلَن هنا، ولا يصل التطبيق
        # إلى عنوان في الشبكة المحلية بلا إذن صريح. ونقص أيّ من المفتاحين يعطي
        # العطل نفسه: بحث لا ينتهي بلا رسالة ولا سؤال، فيبدو أن الخادم مطفأ.
        NSLocalNetworkUsageDescription: >-
          للعثور على بوت الألعاب على جهازك والاتصال به مباشرة، بلا خادم في الإنترنت.
        NSBonjourServices:
          - _miqwad._tcp
        # الخادم على الشبكة المحلية بلا شهادة TLS، وهذه نسخة تُثبَّت جانبيًا لا
        # تدخل المتجر. التفصيل في تعليق هدف Games أعلاه — ومفتاح واحد لا اثنان.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.justpainful.miqwad.auth
            CFBundleURLSchemes: [miqwad]
        UIAppFonts:
          - Cairo-Regular.ttf
          - Cairo-Bold.ttf
          - Baloo-Bold.ttf
          - Baloo-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justpainful.miqwad
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # لا `API_BASE_URL` هنا عمدًا: عنوان الخادم يُكتشف على الشبكة وقت
        # التشغيل، وتثبيته في الحزمة هو بالضبط ما جعل النسخة السابقة تعتمد على
        # Tailscale.

  MiqwadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MiqwadTests]
    dependencies:
      - target: Miqwad
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

  GamesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GamesTests]
    dependencies:
      - target: Games
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

  GamesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GamesUITests]
    dependencies:
      - target: Games
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Games:
    build:
      targets:
        Games: all
        GamesTests: [test]
        GamesUITests: [test]
    test:
      targets: [GamesTests, GamesUITests]
      gatherCoverageData: false

  Miqwad:
    build:
      targets:
        Miqwad: all
        MiqwadTests: [test]
    test:
      targets: [MiqwadTests]
      gatherCoverageData: false
